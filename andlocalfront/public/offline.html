<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Sin conexión · AND Local Ads</title>
    <style>
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100dvh; place-items: center; margin: 0; background: #f5f5f5; padding: 24px; color: #434343; font: 16px/1.5 Arial, Helvetica, sans-serif; }
      main { width: min(100%, 420px); border-radius: 28px; background: #fff; padding: clamp(24px, 7vw, 40px); text-align: center; box-shadow: 0 20px 60px rgb(0 0 0 / 8%); }
      img { width: 64px; height: 64px; }
      h1 { margin: 20px 0 8px; font-size: clamp(24px, 7vw, 32px); line-height: 1.15; }
      p { margin: 0; color: #717171; }
      button { min-height: 44px; margin-top: 24px; border: 0; border-radius: 999px; background: #0b5901; padding: 0 24px; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-icon-192.png" alt="">
      <h1>Necesitas conexión</h1>
      <p>Conéctate a internet para consultar tus cuentas y recargas.</p>
      <button type="button" onclick="location.reload()">Intentar de nuevo</button>
    </main>
  </body>
</html>
